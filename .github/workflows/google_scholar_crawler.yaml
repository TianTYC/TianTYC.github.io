name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'  # 每天 UTC 8:00

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-setuptools
          
      - name: Install Python dependencies
        run: |
          cd ./google_scholar_crawler
          pip3 install --upgrade pip
          pip3 install -r requirements.txt
          
      - name: Run crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          cd ./google_scholar_crawler
          python3 main.py
        continue-on-error: true  # 即使失败也继续
          
      - name: Check results
        id: check_results
        run: |
          if [ -f ./google_scholar_crawler/results/gs_data.json ]; then
            echo "results_exist=true" >> $GITHUB_OUTPUT
            cat ./google_scholar_crawler/results/gs_data.json
          else
            echo "results_exist=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push results
        if: steps.check_results.outputs.results_exist == 'true'
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          
          # 切换到结果目录
          cd ./google_scholar_crawler/results
          
          # 初始化或切换分支
          git init
          git checkout -b google-scholar-stats
          
          # 添加文件
          git add gs_data.json gs_data_shieldsio.json
          
          # 提交（如果有变化）
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Updated citation data - $(date +'%Y-%m-%d %H:%M:%S')"
            
            # 推送到远程
            git push "https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
              google-scholar-stats --force
            
            echo "✅ Successfully updated citation data"
          fi
